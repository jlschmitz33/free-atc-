<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Free ATC</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#0a0f1a; --card:#121a2b; --line:#1f2a40; --text:#e8edf6; --dim:#8b97ad; --accent:#3b82f6; --live:#22c55e; --warn:#ef4444; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 0; background: #1b1f27; }
  .leaflet-control-attribution { font-size: 9px; background: rgba(0,0,0,.4) !important; color: #aaa; }
  .leaflet-control-attribution a { color: #aaa; }

  /* Top bar */
  #top { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
         display: flex; gap: 8px; align-items: center; background: linear-gradient(#0a0f1af0, #0a0f1a00); }
  #airportBtn { flex: 1; background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 14px;
                padding: 10px 14px; font-size: 16px; font-weight: 600; text-align: left; }
  #airportBtn small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  #count { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 13px; color: var(--dim); white-space: nowrap; }

  /* Alert banner */
  #alert { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 64px); z-index: 1001; display: none;
           background: var(--warn); color: #fff; border-radius: 14px; padding: 10px 14px; font-weight: 600; font-size: 14px; }

  /* Bottom sheet */
  #sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000; background: var(--card); border-top: 1px solid var(--line);
           border-radius: 20px 20px 0 0; padding: 10px 14px calc(env(safe-area-inset-bottom) + 12px); }
  #grab { width: 40px; height: 4px; background: #334155; border-radius: 2px; margin: 0 auto 10px; }

  #flight { display: none; margin-bottom: 12px; }
  #flight .head { display: flex; align-items: baseline; justify-content: space-between; }
  #flight .cs { font-size: 22px; font-weight: 700; }
  #flight .type { color: var(--dim); font-size: 13px; }
  #flight .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .stat { background: var(--bg); border-radius: 10px; padding: 6px 8px; }
  .stat b { display: block; font-size: 15px; }
  .stat span { font-size: 11px; color: var(--dim); }
  #flight .actions { display: flex; gap: 8px; margin-top: 8px; }
  #flight .actions a, #flight .actions button { flex: 1; text-align: center; font-size: 13px; padding: 8px; border-radius: 10px;
     background: var(--bg); color: var(--text); border: 1px solid var(--line); text-decoration: none; }

  #radio { display: flex; align-items: center; gap: 10px; }
  #playBtn { width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 20px; flex: none; }
  #playBtn.on { background: var(--live); }
  #radioInfo { flex: 1; min-width: 0; }
  #chanName { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  #liveDot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  #liveDot.on { background: var(--live); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  #radioSub { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chips { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
  .chip { flex: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; background: var(--bg); border: 1px solid var(--line); color: var(--text); }
  .chip.sel { background: var(--accent); border-color: var(--accent); }
  .chip.auto.sel { background: var(--live); border-color: var(--live); }
  #status { font-size: 11px; color: var(--dim); margin-top: 8px; }

  /* Airport picker */
  #picker { position: absolute; inset: 0; z-index: 2000; background: rgba(0,0,0,.6); display: none; }
  #pickerBox { position: absolute; left: 0; right: 0; bottom: 0; max-height: 70%; overflow-y: auto; background: var(--card);
               border-radius: 20px 20px 0 0; padding: 14px 14px calc(env(safe-area-inset-bottom) + 14px); }
  #pickerBox input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 16px; }
  .apt { padding: 12px 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .apt small { color: var(--dim); }
  .feedRow { display: flex; gap: 6px; margin-top: 10px; }
  .feedRow input { flex: 1; }

  /* Map markers */
  .ac { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .ac svg { width: 22px; height: 22px; filter: drop-shadow(0 0 2px #000); }
  .ac.sel svg { width: 30px; height: 30px; }
  .lbl { background: rgba(10,15,26,.85) !important; border: none !important; color: #e8edf6 !important; font-size: 10px !important;
         padding: 1px 4px !important; border-radius: 4px !important; box-shadow: none !important; }
  .lbl::before { display: none; }
  #player { display: none; margin-top: 10px; }
  .pwrap { height: 240px; overflow: hidden; border-radius: 12px; background: #fff; position: relative; }
  #lframe { border: 0; width: 540px; height: 700px; transform-origin: 0 0; position: absolute; top: 0; left: 0; }
  .pnote { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .pnote a { color: #60a5fa; }
  .aptMarker { width: 10px; height: 10px; border: 2px solid #60a5fa; border-radius: 50%; background: #0a0f1a; }
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <button id="airportBtn">KMSP<small>Minneapolis</small></button>
  <div id="count">— aircraft</div>
</div>
<div id="alert"></div>

<div id="sheet">
  <div id="grab"></div>
  <div id="flight">
    <div class="head"><div class="cs" id="fCs"></div><div class="type" id="fType"></div></div>
    <div class="stats">
      <div class="stat"><b id="fAlt">—</b><span>Altitude</span></div>
      <div class="stat"><b id="fSpd">—</b><span>Speed</span></div>
      <div class="stat"><b id="fVs">—</b><span>Vert ft/m</span></div>
      <div class="stat"><b id="fSq">—</b><span>Squawk</span></div>
    </div>
    <div class="actions">
      <a id="fRoute" target="_blank">Route</a>
      <button id="fClose">✕ Unfollow</button>
    </div>
  </div>

  <div id="radio">
    <button id="playBtn">▶</button>
    <div id="radioInfo">
      <div id="chanName"><span id="liveDot"></span><span id="chanText">Tower</span></div>
      <div id="radioSub">Tap ▶ to listen</div>
    </div>
  </div>
  <div id="chips"></div>
  <div id="status">Loading…</div>
  <div id="player">
    <div class="pwrap"><iframe id="lframe" title="LiveATC player" allow="autoplay"></iframe></div>
    <div class="pnote">Tap <b>Play</b> in the player · audio by LiveATC.net · <a id="openExt" target="_blank">open full player ↗</a></div>
  </div>
</div>

<div id="picker"><div id="pickerBox">
  <input id="aptSearch" placeholder="Search 900+ airports (code or city)">
  <div id="aptList"></div>
  </div></div>

<script>
/* ===== Airports & feeds: loaded from a public LiveATC feed catalog (900+ airports) ===== */
let AIRPORTS = { KMSP: { name: 'Minneapolis', full: 'Minneapolis-St Paul', lat: 44.88, lon: -93.222, feeds: [] } };
async function loadCatalog() {
  const sources = ['https://whiskeytuesday.github.io/omarchy-liveatc-feeds/stations.json', '/stations.json'];
  for (const u of sources) {
    try {
      const r = await fetch(u); if (!r.ok) continue;
      const d = await r.json();
      const out = {};
      for (const st of d.stations || []) {
        if (!st.feeds || !st.feeds.length || st.lat == null) continue;
        out[st.icao] = { name: st.city || st.name, full: st.name, lat: st.lat, lon: st.lon,
          feeds: st.feeds.map(f => ({ mount: f.mount, title: f.name, up: f.status !== 'down', kind: kindOf(f.name) })) };
      }
      if (Object.keys(out).length) { AIRPORTS = out; return; }
    } catch (e) {}
  }
}
function kindOf(t) {
  if (/atis|guard|emerg|meter|volmet/i.test(t)) return 'Other';
  if (/gnd|ground|del|clearance|ramp/i.test(t)) return 'Ground';
  if (/tower|twr|ctaf/i.test(t)) return 'Tower';
  if (/app|approach|dep|departure|center|ctr|tracon|radar|final/i.test(t)) return 'Approach';
  return 'Other';
}
const EMERGENCY = { '7500': 'HIJACK', '7600': 'RADIO FAILURE', '7700': 'EMERGENCY' };
const POLL_MS = 5000;

/* ===== State ===== */
let airport = 'KMSP';
let channel = 'auto';        // 'auto' or a channel label
let currentFeed = null;
let followed = null;         // hex
const planes = new Map();    // hex -> { a: raw, t: time, marker }
const $ = id => document.getElementById(id);

/* ===== Map ===== */
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([44.882, -93.222], 10);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Esri | adsb.lol | LiveATC.net', maxZoom: 16 }).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(map);

const aptLayer = L.layerGroup().addTo(map);
function drawAirports() {
  aptLayer.clearLayers();
  for (const [code, ap] of Object.entries(AIRPORTS)) {
    L.marker([ap.lat, ap.lon], { icon: L.divIcon({ className: '', html: '<div class="aptMarker"></div>', iconSize: [10, 10] }) })
      .addTo(aptLayer).bindTooltip(code, { direction: 'right', className: 'lbl' })
      .on('click', () => selectAirport(code));
  }
}

function planeSvg(color) {
  return `<svg viewBox="0 0 24 24"><path fill="${color}" stroke="#000" stroke-width=".6" d="M12 2c.8 0 1.3.9 1.3 2v5.2l8 4.6v2l-8-2.4v4.9l2.2 1.6v1.6L12 20.6l-3.5.9v-1.6l2.2-1.6v-4.9l-8 2.4v-2l8-4.6V4c0-1.1.5-2 1.3-2z"/></svg>`;
}
function planeColor(a, sel) {
  if (EMERGENCY[a.squawk]) return '#ef4444';
  if (sel) return '#22d3ee';
  if (a.alt_baro === 'ground') return '#94a3b8';
  return '#facc15';
}
function planeIcon(a, sel) {
  const rot = a.track ?? a.true_heading ?? 0;
  return L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13],
    html: `<div class="ac${sel ? ' sel' : ''}" style="transform:rotate(${rot}deg)">${planeSvg(planeColor(a, sel))}</div>` });
}

/* Predict position between updates so planes glide smoothly */
function predicted(p) {
  const a = p.a;
  if (a.alt_baro === 'ground' || !a.gs || a.track == null) return [a.lat, a.lon];
  const dt = Math.min((Date.now() - p.t) / 1000, 30);
  const d = a.gs * 0.514444 * dt;                 // meters
  const th = a.track * Math.PI / 180;
  const dLat = d * Math.cos(th) / 111320;
  const dLon = d * Math.sin(th) / (111320 * Math.cos(a.lat * Math.PI / 180));
  return [a.lat + dLat, a.lon + dLon];
}

/* ===== Data ===== */
function nmDist(lat1, lon1, lat2, lon2) { return map.distance([lat1, lon1], [lat2, lon2]) / 1852; }

async function poll() {
  const c = map.getCenter();
  const nm = Math.min(250, Math.ceil(c.distanceTo(map.getBounds().getNorthEast()) / 1852));
  const lat = c.lat.toFixed(3), lon = c.lng.toFixed(3);
  let data;
  for (const u of [`/adsb/v2/point/${lat}/${lon}/${nm}`, `/alive/v2/point/${lat}/${lon}/${nm}`]) {
    try { const r = await fetch(u); if (r.ok) { data = await r.json(); break; } } catch (e) {}
  }
  if (!data) { $('status').textContent = 'Aircraft feed unreachable — retrying'; return; }

  const now = Date.now(), seen = new Set();
  const showLabels = map.getZoom() >= 9;
  const emergencies = [];
  for (const a of (data.ac || data.aircraft || [])) {
    if (a.lat == null || a.lon == null) continue;
    seen.add(a.hex);
    if (EMERGENCY[a.squawk]) emergencies.push(a);
    let p = planes.get(a.hex);
    if (!p) {
      p = { marker: L.marker([a.lat, a.lon]).addTo(map) };
      p.marker.on('click', () => follow(a.hex));
      planes.set(a.hex, p);
    }
    p.a = a; p.t = now;
    p.marker.setIcon(planeIcon(a, a.hex === followed));
    p.marker.setZIndexOffset(a.hex === followed ? 1000 : EMERGENCY[a.squawk] ? 900 : 0);
    const cs = (a.flight || '').trim();
    if (showLabels && cs) {
      if (!p.marker.getTooltip()) p.marker.bindTooltip(cs, { permanent: true, direction: 'right', offset: [10, 0], className: 'lbl' });
      else p.marker.setTooltipContent(cs);
    } else if (p.marker.getTooltip()) p.marker.unbindTooltip();
  }
  for (const [hex, p] of planes) if (!seen.has(hex)) { map.removeLayer(p.marker); planes.delete(hex); }
  if (followed && !planes.has(followed)) unfollow();

  $('count').textContent = `${seen.size} aircraft`;
  $('status').textContent = `Live · updated ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`;
  showAlerts(emergencies);
  updateFlightCard();
  autoTune();
}

/* Smooth motion every second */
setInterval(() => {
  for (const [hex, p] of planes) p.marker.setLatLng(predicted(p));
  if (followed && planes.has(followed)) map.panTo(predicted(planes.get(followed)), { animate: true, duration: 0.9 });
}, 1000);

/* ===== Emergency alerts ===== */
let alertTimer;
function showAlerts(list) {
  const box = $('alert');
  if (!list.length) { box.style.display = 'none'; return; }
  const a = list[0];
  box.textContent = `⚠ ${(a.flight || a.hex).trim()} squawking ${a.squawk} — ${EMERGENCY[a.squawk]}. Tap to view`;
  box.style.display = 'block';
  box.onclick = () => follow(a.hex);
}

/* ===== Follow a flight ===== */
function follow(hex) {
  followed = hex;
  for (const [h, p] of planes) p.marker.setIcon(planeIcon(p.a, h === followed));
  const p = planes.get(hex);
  if (p) map.setView(predicted(p), Math.max(map.getZoom(), 10));
  updateFlightCard();
  autoTune();
}
function unfollow() { followed = null; for (const [h, p] of planes) p.marker.setIcon(planeIcon(p.a, false)); updateFlightCard(); }
$('fClose').onclick = unfollow;
map.on('dragstart', () => { if (followed) unfollow(); });

function updateFlightCard() {
  const card = $('flight');
  const p = followed && planes.get(followed);
  if (!p) { card.style.display = 'none'; return; }
  const a = p.a, cs = (a.flight || a.hex).trim();
  card.style.display = 'block';
  $('fCs').textContent = cs;
  $('fType').textContent = [a.t, a.r].filter(Boolean).join(' · ') || a.desc || '';
  $('fAlt').textContent = a.alt_baro === 'ground' ? 'GND' : (a.alt_baro ?? a.alt_geom ?? '—').toLocaleString();
  $('fSpd').textContent = a.gs != null ? Math.round(a.gs) + ' kt' : '—';
  $('fVs').textContent = a.baro_rate != null ? (a.baro_rate > 0 ? '+' : '') + a.baro_rate : '—';
  $('fSq').textContent = a.squawk || '—';
  $('fSq').style.color = EMERGENCY[a.squawk] ? 'var(--warn)' : '';
  $('fRoute').href = `https://www.flightaware.com/live/flight/${cs}`;
}

/* ===== Radio: LiveATC's own player, embedded in the page ===== */
let feeds = [];
const frame = $('lframe');

function playerUrl(f) { return `https://www.liveatc.net/hlisten.php?mount=${encodeURIComponent(f.mount)}&icao=${airport.toLowerCase()}`; }

function bestFeed(kind) {
  const up = feeds.filter(f => f.up);
  const pool = up.length ? up : feeds;
  return pool.find(f => f.kind === kind)
      || (kind === 'Ground' && pool.find(f => f.kind === 'Tower'))
      || (kind !== 'Approach' && pool.find(f => f.kind === 'Approach'))
      || pool.find(f => f.kind === 'Tower')
      || pool.find(f => f.kind !== 'Other') || pool[0];
}

function kindFor(a, code) {
  const ap = AIRPORTS[code];
  const alt = a.alt_baro === 'ground' ? 0 : (a.alt_baro ?? 99999);
  const d = nmDist(a.lat, a.lon, ap.lat, ap.lon);
  if (alt === 0 || (alt < 300 && (a.gs ?? 0) < 40)) return 'Ground';
  if (alt < 3500 && d < 10) return 'Tower';
  return 'Approach';
}

function nearestAirport(lat, lon, maxNm) {
  let best = null, bestD = maxNm;
  for (const [code, ap] of Object.entries(AIRPORTS)) {
    const d = nmDist(lat, lon, ap.lat, ap.lon);
    if (d < bestD) { best = code; bestD = d; }
  }
  return best ? { code: best, d: bestD } : null;
}

function autoTune() {
  if (channel !== 'auto') return;
  const p = followed && planes.get(followed);
  let kind = 'Tower';
  if (p) {
    const near = nearestAirport(p.a.lat, p.a.lon, 50);
    if (near && near.code !== airport) selectAirport(near.code, true);
    kind = kindFor(p.a, airport);
  }
  const f = bestFeed(kind);
  if (f) setFeed(f, true);
  else { $('chanText').textContent = `${airport} · no LiveATC coverage`; $('radioSub').textContent = 'Pick another airport'; }
}

function setFeed(f, isAuto) {
  $('chanText').textContent = `${f.title}${isAuto ? ' · Auto' : ''}`;
  $('radioSub').textContent = f.up ? `${f.mount} · LiveATC.net` : `${f.mount} · feed reported down`;
  if (f.mount === currentFeed) return;
  currentFeed = f.mount;
  renderChips();
  if (radioOpen) { frame.src = playerUrl(f); $('openExt').href = playerUrl(f); }
}

let radioOpen = false;
function openRadio() {
  const f = feeds.find(x => x.mount === currentFeed); if (!f) return;
  radioOpen = true;
  $('player').style.display = 'block';
  frame.src = playerUrl(f);
  $('openExt').href = playerUrl(f);
  $('playBtn').classList.add('on'); $('playBtn').textContent = '▾'; $('liveDot').classList.add('on');
  fitFrame();
}
function closeRadio() {
  radioOpen = false; frame.src = 'about:blank';
  $('player').style.display = 'none';
  $('playBtn').classList.remove('on'); $('playBtn').textContent = '▶'; $('liveDot').classList.remove('on');
}
$('playBtn').onclick = () => radioOpen ? closeRadio() : openRadio();

function fitFrame() {
  const wrap = document.querySelector('.pwrap'); const w = wrap.clientWidth || 360;
  const sc = Math.min(1, w / 540);
  frame.style.transform = `scale(${sc})`;
  wrap.style.height = Math.round(250 * sc) + 'px';
}
window.addEventListener('resize', fitFrame);

function renderChips() {
  const chips = $('chips'); chips.innerHTML = '';
  const add = (label, val, cls, f) => {
    const b = document.createElement('button');
    const sel = channel === val || (val !== 'auto' && f && f.mount === currentFeed);
    b.className = 'chip' + (cls ? ' ' + cls : '') + (sel ? ' sel' : '');
    b.textContent = label;
    b.onclick = () => { channel = val; if (val === 'auto') autoTune(); else setFeed(f, false); renderChips(); };
    chips.appendChild(b);
  };
  add('Auto', 'auto', 'auto');
  const order = { Tower: 0, Ground: 1, Approach: 2, Other: 3 };
  for (const f of [...feeds].sort((x, y) => order[x.kind] - order[y.kind]))
    add(f.title.replace(new RegExp('^' + airport + '\\s*', 'i'), '') + (f.up ? '' : ' ✕'), f.mount, '', f);
}

/* ===== Airport selection ===== */
function selectAirport(code, fromAuto) {
  if (!AIRPORTS[code]) return;
  airport = code;
  const ap = AIRPORTS[code];
  $('airportBtn').innerHTML = `${code}<small>${ap.name}</small>`;
  feeds = ap.feeds;
  if (!fromAuto) { channel = 'auto'; unfollow(); map.setView([ap.lat, ap.lon], 10); }
  currentFeed = null;
  renderChips();
  if (!fromAuto) autoTune();
  try { localStorage.setItem('freeatc_airport', code); } catch (e) {}
}

function renderAptList(q) {
  q = (q || '').toUpperCase().trim();
  const c = map.getCenter();
  let list = Object.entries(AIRPORTS)
    .filter(([code, ap]) => !q || code.includes(q) || (ap.name + ' ' + ap.full).toUpperCase().includes(q))
    .map(([code, ap]) => [code, ap, nmDist(c.lat, c.lng, ap.lat, ap.lon)])
    .sort((x, y) => x[2] - y[2]).slice(0, 40);
  $('aptList').innerHTML = list.map(([code, ap, d]) =>
    `<div class="apt" data-c="${code}"><b>${code}</b> <small>${ap.full} · ${ap.feeds.length} feeds · ${Math.round(d)} nm</small></div>`).join('');
  for (const el of $('aptList').children) el.onclick = () => { $('picker').style.display = 'none'; selectAirport(el.dataset.c); };
}
$('airportBtn').onclick = () => { renderAptList(''); $('aptSearch').value = ''; $('picker').style.display = 'block'; };
$('picker').onclick = e => { if (e.target.id === 'picker') $('picker').style.display = 'none'; };
$('aptSearch').oninput = e => renderAptList(e.target.value);
/* ===== Start ===== */
(async () => {
  await loadCatalog();
  drawAirports();
  let saved; try { saved = localStorage.getItem('freeatc_airport'); } catch (e) {}
  selectAirport(AIRPORTS[saved] ? saved : (AIRPORTS.KMSP ? 'KMSP' : Object.keys(AIRPORTS)[0]));
  let moveT; map.on('moveend', () => { clearTimeout(moveT); moveT = setTimeout(poll, 500); });
  poll();
  setInterval(poll, POLL_MS);
})();
